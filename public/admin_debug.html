<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Debug - Quike</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fc;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6600;
        }
        .warning {
            color: #e74a3b;
            font-weight: bold;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #e65c00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quike Admin Debug</h1>
        <p class="warning">WARNING: This page is for development purposes only!</p>
        <p>Use this to bypass authentication during development and testing.</p>
        <button id="debug-button">Enter Admin Dashboard</button>
    </div>

    <script>
        document.getElementById('debug-button').addEventListener('click', function() {
            window.location.href = 'index.html?admin_bypass=true';
        });
    </script>
</body>
</html>
